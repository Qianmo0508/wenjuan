<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>第七观测站 · 内部网络</title>
<style>
/* ============================================================
   基础
   ============================================================ */
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:#16181b;
  background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size:40px 40px;
  font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  font-size:13px;
  color:#cfd3d8;
  overflow:hidden;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.mono{font-family:"Consolas","Courier New",monospace;}

/* ============================================================
   顶部系统栏
   ============================================================ */
#topbar{
  position:fixed;top:0;left:0;right:0;height:26px;z-index:5000;
  background:#0f1113;
  border-bottom:1px solid #262a2f;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;
  font-size:11px;color:#8f969e;letter-spacing:.5px;
}
#topbar .tb-left{font-size:11px;}
#clock{font-family:"Consolas","Courier New",monospace;font-size:11px;color:#9aa1a9;letter-spacing:1px;}

/* ============================================================
   桌面图标
   ============================================================ */
#icons{
  position:absolute;top:42px;left:14px;
  display:flex;flex-direction:column;flex-wrap:wrap;
  gap:2px;
  height:calc(100vh - 110px);
  align-content:flex-start;
}
.dicon{
  width:88px;padding:6px 2px 5px;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  cursor:default;
  border:1px solid transparent;
}
.dicon:hover{border:1px dashed rgba(255,255,255,0.35);background:rgba(255,255,255,0.03);}
.dicon .ico{height:42px;display:flex;align-items:flex-end;justify-content:center;}
.dicon .lbl{
  font-size:11px;color:#c3c8ce;text-align:center;line-height:1.4;
  text-shadow:0 1px 2px rgba(0,0,0,.8);
  word-break:break-all;
}

/* ============================================================
   任务栏
   ============================================================ */
#taskbar{
  position:fixed;left:0;right:0;bottom:0;height:32px;z-index:5000;
  background:#0f1113;border-top:1px solid #262a2f;
  display:flex;align-items:center;padding:0 10px;gap:6px;
}
#tb-items{display:flex;gap:4px;flex:1;overflow:hidden;}
.tb-item{
  height:22px;padding:0 9px;background:#23272c;border:1px solid #33383e;
  color:#a9b0b8;font-size:11px;display:flex;align-items:center;
  cursor:default;white-space:nowrap;max-width:180px;overflow:hidden;
}
.tb-item:hover{background:#2c3137;}
#tb-status{font-size:11px;color:#7d848c;display:flex;align-items:center;gap:6px;white-space:nowrap;}
#tb-status .dot{width:6px;height:6px;background:#4a7c59;display:inline-block;}

/* 任务栏通知 */
.notify{
  position:fixed;right:12px;bottom:40px;z-index:8000;
  background:#e8eaed;border:1px solid #b9bdc4;color:#1b1d21;
  padding:8px 14px;font-size:12px;
  box-shadow:0 6px 18px rgba(0,0,0,.55);
  animation:notifyIn .25s ease-out;
  max-width:320px;
}
@keyframes notifyIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* ============================================================
   窗口
   ============================================================ */
.win{
  position:fixed;
  background:#f6f6f4;
  border:1px solid #c9ccd1;
  color:#1b1d21;
  display:flex;flex-direction:column;
  box-shadow:0 10px 30px rgba(0,0,0,.6);
  max-width:calc(100vw - 24px);
  max-height:calc(100vh - 90px);
  user-select:text;
  -webkit-user-select:text;
  touch-action:none; /* 允许自定义手势 */
}
.win-title{
  height:26px;flex:none;
  background:#e8eaed;
  border-bottom:1px solid #c9ccd1;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 4px 0 9px;
  font-size:12px;color:#3a3f46;
  cursor:default;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none; /* 阻止默认滚动 */
  cursor:move;
}
.win-title .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.win-btns{display:flex;flex:none;}
.wb{
  width:26px;height:22px;display:flex;align-items:center;justify-content:center;
  font-size:11px;color:#4a4f56;cursor:default;
  font-family:"Consolas","Courier New",monospace;
}
.wb:hover{background:#d6d9dd;}
.wb-close:hover{background:#c9736f;color:#fff;}
.win-body{
  flex:1;overflow:auto;padding:16px 22px 20px;
  font-size:13px;line-height:1.7;color:#1b1d21;
  position:relative;
  user-select:text;
  -webkit-user-select:text;
  -webkit-overflow-scrolling:touch; /* 手机端流畅滚动 */
  touch-action:pan-y; /* 允许窗口内容垂直滑动 */
}
.win-body::-webkit-scrollbar{width:11px;height:11px;}
.win-body::-webkit-scrollbar-track{background:#eceef0;}
.win-body::-webkit-scrollbar-thumb{background:#c3c7cc;border:2px solid #eceef0;}

/* ============================================================
   文件夹内容列表
   ============================================================ */
.filelist{margin:0;padding:0;list-style:none;}
.filelist li{
  display:flex;align-items:center;gap:8px;
  padding:5px 6px;cursor:default;font-size:13px;color:#1b1d21;
  border:1px solid transparent;
}
.filelist li:hover{background:#e8eef5;border:1px solid #c9d6e4;}
.filelist li .fi{width:18px;height:20px;flex:none;display:flex;align-items:center;}
.filelist li .fn{flex:1;}
.filelist li .fs{color:#6b7078;font-size:11px;font-family:"Consolas","Courier New",monospace;}
.empty-note{color:#6b7078;font-size:12px;padding:14px 2px;}

/* ============================================================
   问卷：页头 / 题干 / 控件
   ============================================================ */
.page-head{
  border-bottom:1px solid #d6d9dd;
  padding-bottom:7px;margin-bottom:14px;
}
.page-title{font-size:14px;font-weight:bold;color:#1b1d21;letter-spacing:.5px;}
.page7-note{
  position:absolute;right:22px;top:16px;
  font-size:12px;color:#6b7078;letter-spacing:0;
}

.q{margin:0 0 14px;padding:0 0 12px;border-bottom:1px dashed #e0e2e5;}
.q:last-of-type{border-bottom:none;}
.q-head{font-size:13px;line-height:1.75;color:#1b1d21;}
.q-no{font-family:"Consolas","Courier New",monospace;color:#2f5d8a;margin-right:3px;}
.q-title{color:#1b1d21;}
.q-title.struck{text-decoration:line-through;color:#8d9299;}
.req{color:#9a4a4a;margin-left:3px;}
.q-hint{color:#6b7078;margin-left:6px;font-size:12px;}
.q-warn{
  color:#8a2b2b;font-size:13px;letter-spacing:.62em;
  margin:4px 0 2px;
}
.q-err{color:#6b7078;font-size:12px;min-height:0;line-height:1.6;}
.q-limit{color:#6b7078;font-size:12px;line-height:1.6;}

.opts{margin-top:5px;display:flex;flex-direction:column;gap:1px;}
.scale-row{margin-top:5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.scale-end{color:#6b7078;font-size:12px;}
.scale-row .opts{flex-direction:row;gap:14px;margin-top:0;}

.opt{
  display:inline-flex;align-items:flex-start;gap:6px;
  font-size:13px;color:#2a2d31;cursor:default;
  padding:1px 0;line-height:1.65;
}
.opt input{position:absolute;opacity:0;width:0;height:0;pointer-events:none;}
.opt .box{
  width:12px;height:12px;flex:none;
  border:1px solid #9aa0a8;background:#fff;
  margin-top:4px;position:relative;
  display:inline-block;
}
.opt input:checked + .box{background:#fff;border-color:#2f5d8a;}
.opt input:checked + .box::after{
  content:"";position:absolute;left:2px;top:2px;width:6px;height:6px;background:#2f5d8a;
}
.opt input:focus + .box{outline:1px dotted #2f5d8a;}
.opt.disabled{color:#a8adb4;cursor:default;}
.opt.disabled .box{border-color:#d2d5d9;background:#f0f1f2;}

.sel{
  border:1px solid #b9bdc4;background:#fff;
  padding:3px 5px;font-size:13px;font-family:inherit;color:#1b1d21;
  border-radius:0;min-width:220px;outline:none;
}
.sel:focus{border-color:#2f5d8a;}
.inp{
  border:1px solid #b9bdc4;background:#fff;
  padding:4px 6px;font-size:13px;font-family:inherit;color:#1b1d21;
  border-radius:0;width:280px;max-width:100%;outline:none;
}
.inp:focus{border-color:#2f5d8a;}
.inp.num{width:110px;}
.unit{color:#4a4f56;margin-left:6px;font-size:13px;}
.ta{
  border:1px solid #b9bdc4;background:#fff;
  padding:5px 7px;font-size:13px;font-family:inherit;color:#1b1d21;
  border-radius:0;width:100%;max-width:520px;height:64px;resize:vertical;outline:none;
  line-height:1.7;
}
.ta:focus{border-color:#2f5d8a;}
.count{color:#6b7078;font-size:11px;font-family:"Consolas","Courier New",monospace;margin-top:2px;}
.other-wrap{margin-top:5px;}

/* 页脚 */
.survey-foot{
  margin-top:18px;padding-top:12px;border-top:1px solid #d6d9dd;
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.foot-left{display:flex;gap:8px;}
.btn{
  font-family:inherit;font-size:12px;color:#2a2d31;
  background:#eceef0;border:1px solid #b9bdc4;
  padding:5px 16px;border-radius:0;cursor:default;
  letter-spacing:.5px;
  touch-action:manipulation; /* 减少点击延迟 */
}
.btn:hover{background:#e2e5e8;}
.btn:active{background:#d8dbdf;}
.btn.primary{background:#dfe7ef;border-color:#9fb3c8;color:#1f4468;}
.btn.primary:hover{background:#d3dfea;}
.btn:disabled{background:#f0f1f2;border-color:#d6d9dd;color:#a8adb4;}
.foot-right{display:flex;flex-direction:column;gap:4px;align-items:flex-end;min-width:200px;}
.prog{width:200px;height:6px;background:#e2e5e8;border:1px solid #d0d4d8;}
.prog-bar{height:100%;background:#8aa6c2;transition:width .5s ease;}
.prog-text{font-size:11px;color:#6b7078;font-family:"Consolas","Courier New",monospace;}

/* ============================================================
   知情同意
   ============================================================ */
.doc-head{font-size:13px;color:#2f5d8a;letter-spacing:1px;}
.doc-sub{font-size:16px;color:#1b1d21;margin:4px 0 2px;letter-spacing:1px;}
.doc-meta{font-size:11px;color:#6b7078;font-family:"Consolas","Courier New",monospace;margin-bottom:12px;}
.consent hr{border:none;border-top:1px solid #d6d9dd;margin:12px 0;}
.consent p{margin:0 0 9px;font-size:13px;color:#1b1d21;line-height:1.85;text-indent:0;}
.consent .opt{margin-top:12px;}

/* ============================================================
   结果报告
   ============================================================ */
.report{font-size:13px;}
.rep-head{
  font-size:13px;color:#2f5d8a;letter-spacing:.5px;line-height:1.9;
  border-bottom:1px solid #d6d9dd;padding-bottom:8px;margin-bottom:12px;
}
.rep-flag{
  display:inline-block;border:1px solid #8a2b2b;color:#8a2b2b;
  font-size:11px;padding:0 6px;margin-left:8px;letter-spacing:2px;vertical-align:2px;
}
.rep-table{width:100%;border-collapse:collapse;margin-bottom:14px;}
.rep-table td{
  border:1px solid #dfe1e4;padding:4px 9px;font-size:12px;vertical-align:top;
}
.rep-table td:first-child{
  width:110px;color:#6b7078;background:#f0f1f2;
  font-family:"Consolas","Courier New",monospace;font-size:11px;letter-spacing:.5px;
}
.rep-note{color:#6b7078;font-size:12px;margin-top:-8px;margin-bottom:14px;}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.bar-label{width:86px;font-size:12px;color:#4a4f56;font-family:"Consolas","Courier New",monospace;letter-spacing:.5px;}
.bar-track{flex:1;height:8px;background:#e5e7ea;border:1px solid #d6d9dd;max-width:280px;}
.bar-fill{height:100%;background:#8aa6c2;transition:width .8s ease;}
.bar-num{font-family:"Consolas","Courier New",monospace;font-size:11px;color:#6b7078;width:34px;text-align:right;}
.rep-sec{margin:16px 0 8px;font-size:12px;color:#2f5d8a;letter-spacing:1px;border-bottom:1px solid #e0e2e5;padding-bottom:4px;}
.rep-concl-title{font-size:15px;color:#1b1d21;letter-spacing:2px;margin:6px 0 4px;}
.rep-concl-body{
  border:1px solid #d6d9dd;background:#f0f1f2;
  padding:8px 12px;font-size:13px;color:#1b1d21;line-height:1.8;
}
.rep-quote{
  border-left:2px solid #c9ccd1;padding:1px 0 1px 10px;margin:6px 0;
  color:#4a4f56;font-size:12.5px;line-height:1.85;
}
.rep-advice{margin:0;padding-left:20px;color:#2a2d31;font-size:12.5px;line-height:1.95;}
.rep-advice li{margin-bottom:1px;}
.rep-tail{color:#6b7078;font-size:12px;margin-top:12px;line-height:1.8;}
.rep-foot{
  margin-top:18px;padding-top:10px;border-top:1px solid #d6d9dd;
  font-size:12px;color:#4a4f56;line-height:2;
  font-family:"Consolas","Courier New",monospace;letter-spacing:.5px;
}

/* ============================================================
   纯文本文件窗口
   ============================================================ */
.txtdoc{
  font-family:"Consolas","Courier New",monospace;
  font-size:12.5px;line-height:1.85;color:#1b1d21;white-space:pre-wrap;
  user-select:text;
  -webkit-user-select:text;
}

/* ============================================================
   模态
   ============================================================ */
#modal-layer{
  position:fixed;inset:0;z-index:9000;display:none;
  align-items:center;justify-content:center;
  background:rgba(10,12,14,.45);
}
#modal-layer.on{display:flex;}
.modal{
  background:#f6f6f4;border:1px solid #c9ccd1;color:#1b1d21;
  width:340px;max-width:calc(100vw - 32px);
  box-shadow:0 14px 40px rgba(0,0,0,.6);
}
.modal .m-title{
  height:26px;background:#e8eaed;border-bottom:1px solid #c9ccd1;
  display:flex;align-items:center;padding:0 10px;font-size:12px;color:#3a3f46;
}
.modal .m-body{padding:16px 16px 12px;font-size:13px;line-height:1.8;}
.modal .m-btns{display:flex;justify-content:flex-end;gap:8px;padding:0 16px 14px;}

/* 通用小工具 */
.gray{color:#6b7078;}
.mono-s{font-family:"Consolas","Courier New",monospace;}

/* ============================================================
   移动端特别修正：让图标可以滑动，窗口可以拖动
   ============================================================ */
@media (max-width: 600px) {
  #icons {
    flex-direction: row;
    flex-wrap: wrap;
    height: auto;
    left: 0;
    right: 0;
    top: 36px;
    justify-content: center;
    gap: 6px;
    padding: 0 8px;
  }
  .dicon {
    width: 72px;
    padding: 4px 2px;
  }
  .dicon .ico { height: 34px; }
  .dicon .lbl { font-size: 10px; }
  .win {
    max-width: calc(100vw - 8px);
    max-height: calc(100vh - 60px);
  }
  .win-body {
    padding: 12px 12px 16px;
  }
  .win-title {
    cursor: grab;
  }
  .win-title:active {
    cursor: grabbing;
  }
  .sel, .inp, .ta {
    max-width: 100%;
  }
}
</style>
</head>
<body>

  <span class="tb-left">第七观测站 · 内部网络</span>

<!-- 桌面图标 -->

  <div class="dicon" data-open="archive">

<script>
"use strict";

/* ============================================================
   0. 全局状态
   ============================================================ */
const state = {
  answers: {},                       // 题目 id -> 答案
  scores: { comply: 0, aware: 0, residue: 0 },
  page: 0,
  flags: {
    q13: null,                       // 第 13 题的处理方式
    forcedIncomplete: false,         // 是否被强制补全
    completed: false,                // 是否完成过普查
    backFail: {},                    // 上一页失灵的页
    padded: {},                      // 已追加过字符的输入框
    archiveId: null,
    clockFrozen: null,
    reopenCount: 0
  },
  meta: { name: "", floor: "", household: "", door: "", contact: "" }
};

let surveyWin = null;
let zTop = 100;
const windows = [];
let fadeTimer = null;

/* ============================================================
   1. 文案集中管理
   ============================================================ */
const TEXTS = {
  notice: [
    "填表须知",
    "",
    "一、本表为《居民状态普查表（B-7 修订版）》，由第七观测站居民服务与归档科统一发放。",
    "二、本表共九页，请按顺序填写。填写过程中请勿关闭页面。",
    "三、标注 * 的题目为必填项。未填写必填项时无法进入下一页。",
    "四、本表采用匿名方式，所填信息仅用于统计与归档。",
    "五、如遇系统提示或页面异常，请勿自行处理，等待值班人员。",
    "六、如有疑问，请联系内线 0。",
    "",
    "（本须知随表发放，不单独归档。）"
  ].join("\n"),

  readme: [
    "第七观测站 内部网络 系统说明",
    "--------------------------------",
    "版本：3.1.7（本地部署）",
    "部署位置：居民服务与归档科 / 终端 04",
    "",

function syncMeta() {
  const nm = state.answers["q1"];

function isBlank(v) {
  if (v === undefined || v === null) return true;
  if (typeof v === "string") return v.trim() === "";
  if (Array.isArray(v)) return v.length === 0;
  return false;
}

function getPageQuestions(pageIdx) {

function findQuestion(id) {
  for (let p = 1; p <= 7; p++) {
    const qs = getPageQuestions(p);
    for (let i = 0; i < qs.length; i++) {
      if (qs[i].id === id) return qs[i];
    }
  }
  return null;
}

/* ============================================================
   4. 窗口系统
   ============================================================ */
function focusWin(win) {
  if (!win || !win.el) return;
  win.el.style.zIndex = ++zTop;
}

function createWindow(opts) {
  const win = {};
  const el = document.createElement("div");
  el.className = "win";
  const w = opts.width || 600;
  const h = opts.height || 460;
  el.style.width = w + "px";
  el.style.height = h + "px";

  const n = windows.length % 5;
  el.style.left = Math.max(20, 130 + n * 26) + "px";
  el.style.top = Math.max(36, 62 + n * 22) + "px";
  el.style.zIndex = ++zTop;

  el.innerHTML =
    '<div class="win-title">' +
      '<span class="t"></span>' +
      '<span class="win-btns">' +
        '<span class="wb wb-min">─</span>' +
        '<span class="wb wb-max">□</span>' +
        '<span class="wb wb-close">×</span>' +
      '</span>' +
    '</div>' +
    '<div class="win-body"></div>';

  el.querySelector(".win-title .t").textContent = opts.title || "";
  const body = el.querySelector(".win-body");
  if (opts.content) body.innerHTML = opts.content;

  document.body.appendChild(el);

  win.el = el;
  win.body = body;
  win.title = opts.title || "";
  win.minimized = false;
  win.beforeClose = null;
  win.onClose = opts.onClose || null;

  win.setTitle = function (t) {
    win.title = t;
    el.querySelector(".win-title .t").textContent = t;
  };
  win.setBody = function (html) {
    body.innerHTML = html;
  };
  win.close = function () {
    if (win.beforeClose && win.beforeClose() === false) return;
    el.remove();
    if (win.tbItem && win.tbItem.parentNode) win.tbItem.remove();
    const i = windows.indexOf(win);
    if (i >= 0) windows.splice(i, 1);
    if (win.onClose) win.onClose();
  };
  win.minimize = function () {
    el.style.display = "none";
    win.minimized = true;
    const item = document.createElement("div");
    item.className = "tb-item";
    item.textContent = win.title;
    item.addEventListener("click", function () {
      el.style.display = "flex";
      win.minimized = false;
      focusWin(win);
      if (item.parentNode) item.remove();
      win.tbItem = null;
    });
    document.getElementById("tb-items").appendChild(item);
    win.tbItem = item;
  };

  /* 置顶 */
  el.addEventListener("mousedown", function () { focusWin(win); });
  el.addEventListener("touchstart", function () { focusWin(win); }, { passive: true });

  /* 关闭 / 最小化 */
  el.querySelector(".wb-close").addEventListener("click", function (e) {
    e.stopPropagation();
    win.close();
  });
  el.querySelector(".wb-min").addEventListener("click", function (e) {
    e.stopPropagation();
    win.minimize();
  });
  el.querySelector(".wb-max").addEventListener("click", function (e) {
    e.stopPropagation();
  });

  /* 拖动：鼠标与触摸 */
  const titleBar = el.querySelector(".win-title");
  let dragStart = null;

  function onDragStart(e) {
    if (e.target.classList.contains("wb")) return;
    focusWin(win);
    const clientX = e.type.startsWith("touch") ? e.touches[0].clientX : e.clientX;
    const clientY = e.type.startsWith("touch") ? e.touches[0].clientY : e.clientY;
    dragStart = {
      x: clientX,
      y: clientY,
      left: el.offsetLeft,
      top: el.offsetTop
    };
    if (e.type === "mousedown") {
      document.addEventListener("mousemove", onDragMove);
      document.addEventListener("mouseup", onDragEnd);
    } else {
      document.addEventListener("touchmove", onDragMove, { passive: false });
      document.addEventListener("touchend", onDragEnd);
      document.addEventListener("touchcancel", onDragEnd);
    }
  }

  function onDragMove(e) {
    if (!dragStart) return;
    if (e.cancelable) e.preventDefault(); // 阻止滚动
    const clientX = e.type.startsWith("touch") ? e.touches[0].clientX : e.clientX;
    const clientY = e.type.startsWith("touch") ? e.touches[0].clientY : e.clientY;
    const dx = clientX - dragStart.x;
    const dy = clientY - dragStart.y;

    let newLeft = dragStart.left + dx;
    let newTop = dragStart.top + dy;

    // 限制窗口不能完全移出可视区域（简单限制）
    const winW = el.offsetWidth;
    const winH = el.offsetHeight;
    const maxLeft = window.innerWidth - 40;
    const maxTop = window.innerHeight - 40;
    newLeft = Math.max(-winW + 60, Math.min(maxLeft, newLeft));
    newTop = Math.max(26, Math.min(maxTop, newTop));

    el.style.left = newLeft + "px";
    el.style.top = newTop + "px";
  }

  function onDragEnd() {
    dragStart = null;
    document.removeEventListener("mousemove", onDragMove);
    document.removeEventListener("mouseup", onDragEnd);
    document.removeEventListener("touchmove", onDragMove);
    document.removeEventListener("touchend", onDragEnd);
    document.removeEventListener("touchcancel", onDragEnd);
  }

  titleBar.addEventListener("mousedown", onDragStart);
  titleBar.addEventListener("touchstart", onDragStart, { passive: false });

  windows.push(win);

}

function showModal(text, onOk, okLabel, cancelLabel) {
  const layer = document.getElementById("modal-layer");
  layer.innerHTML =
    '<div class="modal">' +
      '<div class="m-title">系统提示</div>' +
      '<div class="m-body">' + escapeText(text) + '</div>' +
      '<div class="m-btns">' +
        '<button class="btn" data-m="cancel">' + (cancelLabel || "取消") + '</button>' +
        '<button class="btn primary" data-m="ok">' + (okLabel || "确定") + '</button>' +
      '</div>' +
    '</div>';
  layer.classList.add("on");
  layer.querySelector('[data-m="cancel"]').addEventListener("click", function () {
    layer.classList.remove("on");
    layer.innerHTML = "";
  });
  layer.querySelector('[data-m="ok"]').addEventListener("click", function () {
    layer.classList.remove("on");
    layer.innerHTML = "";
    if (onOk) onOk();
  });
}

function notify(text) {
  const n = document.createElement("div");
  n.className = "notify";
  n.textContent = text;
  document.body.appendChild(n);
  setTimeout(function () {
    if (n.parentNode) n.remove();
  }, 6500);
}

function tickClock() {
  const el = document.getElementById("clock");
  if (state.flags.clockFrozen) {
    el.textContent = state.flags.clockFrozen;
    return;
  }
  const d = new Date();
  const hh = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  const ss = String(d.getSeconds()).padStart(2, "0");
  el.textContent = hh + ":" + mm + ":" + ss;
}
setInterval(tickClock, 1000);
tickClock();

function freezeClockIfNeeded(pageIdx) {
  if (pageIdx >= 6 && !state.flags.clockFrozen) {
    const d = new Date();
    state.flags.clockFrozen =
      String(d.getHours()).padStart(2, "0") + ":" +
      String(d.getMinutes()).padStart(2, "0") + ":" +
      String(d.getSeconds()).padStart(2, "0");
  }
}

function renderQuestionHTML(q) {
  let h = '<div class="q" data-qid="' + q.id + '">';

  h += '<div class="q-head">';
  h += '<span class="q-no">' + q.no + '.</span>';
  if (q.title) {
    h += '<span class="q-title' + (q.struck ? " struck" : "") + '">' + escapeText(q.title) + '</span>';
  }
  if (q.required) h += '<span class="req">*</span>';
  if (q.hint) h += '<span class="q-hint">' + escapeText(q.hint) + '</span>';
  h += '</div>';

  if (q.warn) h += '<div class="q-warn">' + escapeText(q.warn) + '</div>';

  const val = state.answers[q.id];

  if (q.type === "radio" || q.type === "checkbox" || q.type === "scale") {
    if (q.type === "scale") {
      h += '<div class="scale-row">';
      if (q.minLabel) h += '<span class="scale-end">' + escapeText(q.minLabel) + '</span>';
      h += '<div class="opts">';
      (q.options || []).forEach(function (o) {
        const checked = (val === o.label);
        h += '<label class="opt">' +
          '<input type="radio" name="' + q.id + '" value="' + escapeAttr(o.label) + '" data-qid="' + q.id + '"' + (checked ? " checked" : "") + '>' +
          '<span class="box"></span><span class="lb">' + escapeText(o.label) + '</span>' +
          '</label>';
      });
      h += '</div>';
      if (q.maxLabel) h += '<span class="scale-end">' + escapeText(q.maxLabel) + '</span>';
      h += '</div>';
    } else {
      h += '<div class="opts">';
      (q.options || []).forEach(function (o) {
        let checked = false;
        if (q.type === "radio") {
          checked = (val === o.label);
        } else {
          checked = Array.isArray(val) && val.indexOf(o.label) >= 0;
        }
        h += '<label class="opt' + (o.disabled ? " disabled" : "") + '">' +
          '<input type="' + q.type + '" name="' + q.id + '" value="' + escapeAttr(o.label) + '" data-qid="' + q.id + '"' +
          (checked ? " checked" : "") + (o.disabled ? " disabled" : "") + '>' +
          '<span class="box"></span><span class="lb">' + escapeText(o.label) + '</span>' +
          '</label>';
      });
      h += '</div>';
      if (q.limit) {
        h += '<div class="q-limit" data-limitfor="' + q.id + '"></div>';
      }
    }
  } else if (q.type === "select") {
    h += '<select class="sel" data-qid="' + q.id + '">';
    h += '<option value="">' + escapeText(q.placeholder || "请选择") + '</option>';
    (q.options || []).forEach(function (o) {
      h += '<option value="' + escapeAttr(o.label) + '"' + (val === o.label ? " selected" : "") + '>' + escapeText(o.label) + '</option>';
    });
    h += '</select>';
  } else if (q.type === "input") {
    h += '<input class="inp" type="text" data-qid="' + q.id + '" value="' + escapeAttr(val || "") + '"' +
      ' placeholder="' + escapeAttr(q.placeholder || "") + '" maxlength="' + (q.maxlength || 60) + '">';
  } else if (q.type === "number") {
    h += '<input class="inp num" type="number" data-qid="' + q.id + '" value="' + escapeAttr(val || "") + '"' +
      ' min="' + (q.min !== undefined ? q.min : 0) + '" max="' + (q.max !== undefined ? q.max : 999) + '">';
    h += '<span class="unit">' + escapeText(q.unit || "") + '</span>';
  } else if (q.type === "textarea") {
    const max = q.maxlength || 200;
    const cur = (val || "").length;
    h += '<textarea class="ta" data-qid="' + q.id + '" maxlength="' + max + '"' +
      ' placeholder="' + escapeAttr(q.placeholder || "") + '">' + escapeText(val || "") + '</textarea>';
    h += '<div class="count">' + cur + "/" + max + '</div>';
  }

  if (q.other) {
    const show = (state.answers[q.id] === "其他");
    const ov = state.answers[q.id + "_other"] || "";
    h += '<div class="other-wrap" data-otherfor="' + q.id + '" style="display:' + (show ? "block" : "none") + '">' +
      '<input class="inp" type="text" data-qid="' + (q.id + "_other") + '" value="' + escapeAttr(ov) + '" placeholder="请说明" maxlength="30">' +
      '</div>';
  }

  h += '<div class="q-err"></div>';
  h += '</div>';
  return h;
}

function validatePage(pageIdx) {
  const qs = getPageQuestions(pageIdx);
  let ok = true;
  qs.forEach(function (q) {
    if (!q.required) return;
    const a = state.answers[q.id];
    const errEl = surveyWin.body.querySelector('.q[data-qid="' + q.id + '"] .q-err');
    if (isBlank(a)) {
      ok = false;
      if (errEl) errEl.textContent = "此项为必填项。";
    } else {
      if (errEl) errEl.textContent = "";
    }
  });
  return ok;
}

const BACK_FAIL_PAGES = [4, 6];

function nextPage() {
  const p = state.page;
  if (p === 0) {
    if (!state.answers["__consent"]) return;
    goPage(1);
    return;
  }
  if (!validatePage(p)) return;
  if (p === 7) {
    state.flags.completed = true;
    goPage(8);
    return;
  }
  goPage(p + 1);
}

function prevPage() {
  const p = state.page;
  if (p <= 1) return;
  if (BACK_FAIL_PAGES.indexOf(p) >= 0 && !state.flags.backFail[p]) {
    state.flags.backFail[p] = true;
    return;
  }
  goPage(p - 1);
}

/* ============================================================
   10. 计分
   ============================================================ */
function calcScores() {
  let comply = 0, aware = 0, residue = 0;

  for (let p = 1; p <= 7; p++) {
    const qs = getPageQuestions(p);
    qs.forEach(function (q) {
      const a = state.answers[q.id];
      const answered = !isBlank(a);

      if (answered) comply += 1;

      if (q.type === "input" || q.type === "number" || q.type === "textarea") {
        if (answered) {
          comply += 1;
          if (q.residue) residue += 3;
        }
      } else if (q.type === "scale") {
        if (answered) comply += 1;
      } else {
        const sel = Array.isArray(a) ? a : (a ? [a] : []);
        sel.forEach(function (lb) {
          const o = (q.options || []).filter(function (x) { return x.label === lb; })[0];
          if (!o) return;
          (o.tags || []).forEach(function (t) {
            if (t === "aware") aware += o.w;
            else if (t === "residue") residue += o.w;
            else if (t === "comply" || t === "deny") comply += o.w;
          });
        });
      }
    });
  }

  const q13 = state.answers["q39"];
  if (q13 === "愿意") comply += 8;
  else if (q13 === "不愿意") { aware += 4; comply -= 4; }
  else if (q13 === "请让我回去") { aware += 2; }

  function norm(v, d) {
    const r = Math.round((v / d) * 100);
    return Math.max(0, Math.min(100, r));
  }

  state.scores = {
    comply: norm(comply, 95),
    aware: norm(aware, 30),
    residue: norm(residue, 18)
  };
}

/* ============================================================
   11. 结论与建议
   ============================================================ */
function getConclusion() {
  const aware = state.scores.aware;
  const comply = state.scores.comply;

  if (state.flags.forcedIncomplete) {
    return {
      key: "closed",
      title: "未完成",
      body: "表单未完成。系统已代为补全。",
      tail: "表单未完成。系统已代为补全。"
    };
  }

  const q13 = state.answers["q39"];
  if (q13 === "愿意") {
    return {
      key: "stay",
      title: "留存",
      body: "您已同意继续留存。本表归入常驻档案。",
      tail: "您已同意继续留存。"
    };
  }
  if (q13 === "不愿意") {
    return {
      key: "leave",
      title: "转出",
      body: "您的转出申请已受理，请等待通知。",
      tail: "您的转出申请已受理，请等待通知。"
    };
  }
  if (q13 === "请让我回去") {
    return {
      key: "return",
      title: "返回",
      body: "未找到可返回的路径。本条已记录。",
      tail: "未找到可返回的路径。本条已记录。"
    };
  }

  if (aware >= 80) {
    return { key: "match", title: "已确认匹配", body: "已确认匹配。请勿关闭本页面。", tail: "" };
  }
  if (aware < 25 && comply >= 60) {
    return { key: "stable", title: "状态稳定", body: "状态稳定，予以归档。", tail: "" };
  }
  if (aware >= 25 && aware <= 54 && comply >= 50) {
    return { key: "mild", title: "轻度偏差", body: "存在轻度偏差，建议复查。", tail: "" };
  }
  if (aware >= 55 && comply >= 50) {
    return { key: "doubt", title: "分类存疑", body: "分类存疑，转入观察程序。", tail: "" };
  }
  if (aware >= 55 && comply < 50) {
    return { key: "refuse", title: "拒绝登记", body: "当事人拒绝配合。记录在案，不予归档。", tail: "" };
  }
  return { key: "lack", title: "资料不足", body: "资料不足，本次普查视为未完成。", tail: "" };
}

  let h = '<div class="report">';

  if (state.flags.forcedIncomplete) {
    h += '<span class="rep-flag">补全</span>';
  }
  h += '</div>';

  h += '<table class="rep-table">';
  h += '<tr><td>档案编号</td><td class="mono-s">' + id + '</td></tr>';
  h += '<tr><td>姓名</td><td>' + escapeText(name) + '</td></tr>';
  h += '<tr><td>居住区域</td><td>' + escapeText(state.answers["q6"] || "（未提供）") + '</td></tr>';
  h += '<tr><td>居住楼层</td><td>' + escapeText(state.meta.floor ? state.meta.floor + " 层" : "（未提供）") + '</td></tr>';
  h += '<tr><td>门牌号</td><td>' + escapeText(state.meta.door || "（未提供）") + '</td></tr>';
  h += '<tr><td>表单状态</td><td>' + (state.flags.forcedIncomplete ? "未完成（系统补全）" : "已提交") + '</td></tr>';
  h += '</table>';

  if (!state.meta.name) {
    h += '<div class="rep-note">我们仍能确认您是本人。</div>';
  }

  h += '<div class="rep-sec">状态指标</div>';
  const bars = [
    { label: "配合度", val: s.comply },
    { label: "稳定性", val: stability },
    { label: "档案完整度", val: s.residue }
  ];
  bars.forEach(function (b) {
    h += '<div class="bar-row">' +
      '<span class="bar-label">' + b.label + '</span>' +
      '<span class="bar-track"><span class="bar-fill" style="width:' + b.val + '%"></span></span>' +
      '<span class="bar-num">' + b.val + '</span>' +
      '</div>';
  });

  h += '<div class="rep-sec">结论</div>';
  h += '<div class="rep-concl-title">' + escapeText(concl.title) + '</div>';
  h += '<div class="rep-concl-body">' + escapeText(concl.body) + '</div>';

  h += '<div class="rep-sec">原始回答摘录</div>';
  buildQuotes().forEach(function (q) {
    h += '<div class="rep-quote">' + escapeText(q) + '</div>';
  });

  h += '<div class="rep-sec">建议措施</div>';
  h += '<ul class="rep-advice">';
  (ADVICE_MAP[concl.key] || ADVICE_MAP.lack).forEach(function (a) {
    h += '<li>' + escapeText(a) + '</li>';
  });
  h += '</ul>';

  if (s.residue >= 60) {
    h += '<div class="rep-tail">您的信息已与现有档案完成比对。</div>';
  }

  if (concl.tail) {
    h += '<div class="rep-tail">' + escapeText(concl.tail) + '</div>';
  }

  h += '<div class="rep-foot">';
  h += '经办人：____　复核：____　日期：' + dateStr(0) + '<br>';
  h += '经办人：____　复核：____　日期：' + dateStr(1) + '<br>';
  h += '经办人：____　复核：____　日期：' + dateStr(2);
  h += '</div>';

  h += '</div>';
  return h;
}

/* ============================================================
   13. 渲染主入口
   ============================================================ */
function renderSurvey() {
  if (!surveyWin) return;
  const p = state.page;
  let html = "";
  if (p === 0) html = renderConsentHTML();
  else if (p >= 1 && p <= 7) html = renderQuestionsHTML(p);
  else html = renderReportHTML();

  surveyWin.setBody(html);
  afterRender();
}

function afterRender() {
  if (!surveyWin) return;
  const body = surveyWin.body;

  if (state.page === 8) {
    surveyWin.beforeClose = function () {
      showModal("本次普查结果尚未归档，确定要放弃吗？", function () {
        state.flags.reopenCount += 1;
        surveyWin.beforeClose = null;
        surveyWin.close();
        surveyWin = null;
        setTimeout(function () {
          openSurvey(8);
        }, 500);
      }, "确定", "取消");
      return false;
    };
  } else {
    surveyWin.beforeClose = null;
  }

  clearTimeout(fadeTimer);
  const cands = body.querySelectorAll(".q-title, .q-hint, .consent p, .doc-meta, .page-title");
  if (cands.length) {
    const pick = cands[Math.floor(Math.random() * cands.length)];
    fadeTimer = setTimeout(function () {
      if (!document.body.contains(pick)) return;
      pick.style.transition = "color 5s linear";
      pick.style.color = "#b3b7bd";
    }, 20000);
  }

  const cb = body.querySelector("#consentBox");
  if (cb) {
    cb.addEventListener("change", function () {
      saveAnswer("__consent", cb.checked);
      const btn = surveyWin.body.querySelector('[data-act="next"]');
      if (btn) {
        btn.disabled = !cb.checked;
        btn.textContent = cb.checked ? "开始填写" : "请先阅读并同意";
      }
    });
  }
}

/* ============================================================
   14. 问卷窗口事件绑定
   ============================================================ */
function bindSurveyEvents() {
  if (!surveyWin) return;
  const body = surveyWin.body;

  body.addEventListener("click", function (e) {
    const t = e.target.closest("[data-act]");
    if (!t) return;
    const act = t.dataset.act;
    if (act === "next") nextPage();
    else if (act === "prev") prevPage();
  });

  body.addEventListener("change", function (e) {
    const t = e.target;

    if (t.matches('input[type="radio"], input[type="checkbox"]')) {
      if (!t.dataset.qid) return;
      handleChoice(t);
    } else if (t.matches("select")) {
      if (!t.dataset.qid) return;
      saveAnswer(t.dataset.qid, t.value);
    }
  });

  body.addEventListener("input", function (e) {
    const t = e.target;
    if (!t.dataset || !t.dataset.qid) return;
    if (t.matches('input[type="text"], input[type="number"], textarea')) {
      saveAnswer(t.dataset.qid, t.value);
      if (t.tagName === "TEXTAREA") {
        const wrap = t.parentElement;
        const c = wrap ? wrap.querySelector(".count") : null;
        if (c) c.textContent = t.value.length + "/" + t.maxLength;
      }
      maybePad(t);
    }
  });
}

function handleChoice(el) {
  const qid = el.dataset.qid;
  const q = findQuestion(qid);
  if (!q) return;

  if (el.type === "radio") {
    saveAnswer(qid, el.value);

    if (q.other) {
      const wrap = surveyWin.body.querySelector('[data-otherfor="' + qid + '"]');
      if (wrap) wrap.style.display = (el.value === "其他") ? "block" : "none";
    }
    return;
  }

  let arr = state.answers[qid];
  if (!Array.isArray(arr)) arr = [];

  if (el.checked) {
    if (q.limit && arr.length >= q.limit) {
      el.checked = false;
      const tip = surveyWin.body.querySelector('[data-limitfor="' + qid + '"]');
      if (tip) {
        tip.textContent = q.limitMsg || ("最多选择" + q.limit + "项");
        setTimeout(function () { if (tip) tip.textContent = ""; }, 2600);
      }
      return;
    }
    arr = arr.concat([el.value]);
  } else {
    arr = arr.filter(function (v) { return v !== el.value; });
  }
  saveAnswer(qid, arr);
}

function maybePad(el) {
  const qid = el.dataset.qid;
  if (!qid) return;
  if (state.flags.padded[qid]) return;
  if (el.type === "number") return;
  if (Math.random() > 0.15) return;
  state.flags.padded[qid] = true;
  const pool = "的一是在不了有和人这中大为上个国我以要他时来用们";
  setTimeout(function () {
    if (!document.body.contains(el)) return;
    const ch = pool[Math.floor(Math.random() * pool.length)];
    el.value = el.value + ch;
    state.answers[qid] = el.value;
    if (el.tagName === "TEXTAREA") {
      const wrap = el.parentElement;
      const c = wrap ? wrap.querySelector(".count") : null;
      if (c) c.textContent = el.value.length + "/" + el.maxLength;
    }
  }, 900);
}

/* ============================================================
   15. 打开问卷
   ============================================================ */
function openSurvey(startPage) {
  if (surveyWin) {
    surveyWin.el.style.display = "flex";
    surveyWin.minimized = false;
    focusWin(surveyWin);
    if (typeof startPage === "number") state.page = startPage;
    renderSurvey();
    return surveyWin;
  }

  surveyWin = createWindow({
    title: "B-7 普查问卷 - 居民档案",
    width: 720,
    height: 600,
    onClose: handleSurveyClose
  });

  bindSurveyEvents();

  if (typeof startPage === "number") state.page = startPage;
  renderSurvey();
  return surveyWin;
}

function handleSurveyClose() {
  if (state.page === 7) {
    state.flags.q13 = "closed";
    state.flags.forcedIncomplete = true;
    state.flags.completed = true;
    surveyWin = null;
    setTimeout(function () {
      notify("检测到未完成的表单，已为您自动恢复。");
      setTimeout(function () {
        openSurvey(8);
      }, 900);
    }, 2000);
    return;
  }
  surveyWin = null;
}

/* ============================================================
   16. 文件夹与文件
   ============================================================ */
function openTextWin(title, text, w, h) {
  createWindow({
    title: title,
    width: w || 560,
    height: h || 480,
    content: '<div class="txtdoc">' + escapeText(text) + "</div>"
  });
}

function fileItemHTML(name, size, kind) {
  let svg = "";
  if (kind === "folder") {
    svg = '<svg viewBox="0 0 48 40" width="16" height="14"><path d="M2 6h14l4 5h26v23H2z" fill="#5a6470" stroke="#8b939d" stroke-width="1.6"/></svg>';
  } else {
    svg = '<svg viewBox="0 0 40 48" width="14" height="17"><path d="M6 3h20l8 8v34H6z" fill="#dfe2e6" stroke="#8d949c" stroke-width="2"/><path d="M26 3v8h8" fill="none" stroke="#8d949c" stroke-width="2"/></svg>';
  }
  return '<li data-file="' + escapeAttr(name) + '">' +
    '<span class="fi">' + svg + '</span>' +
    '<span class="fn">' + escapeText(name) + '</span>' +
    '<span class="fs">' + escapeText(size || "") + '</span>' +
    '</li>';
}

function openArchiveFolder() {
  const win = createWindow({
    title: "居民档案",
    width: 520,
    height: 340
  });
  let h = '<ul class="filelist">';
  h += fileItemHTML("B-7 普查问卷", "应用", "file");
  h += fileItemHTML("填表须知.txt", "1 KB", "file");
  h += "</ul>";
  win.setBody(h);

  win.body.addEventListener("click", function (e) {
    const li = e.target.closest("li[data-file]");
    if (!li) return;
    const name = li.dataset.file;
    if (name === "B-7 普查问卷") {
      openSurvey();
    } else if (name === "填表须知.txt") {
      openTextWin("填表须知.txt", TEXTS.notice, 540, 430);
    }
  });
}

function openRulesFolder() {
  const win = createWindow({
    title: "内部规章",
    width: 520,
    height: 300
  });
  let h = '<ul class="filelist">';
  h += fileItemHTML("值班守则.txt", "2 KB", "file");
  h += fileItemHTML("交接班记录.log", "1 KB", "file");
  h += "</ul>";
  win.setBody(h);

  win.body.addEventListener("click", function (e) {
    const li = e.target.closest("li[data-file]");
    if (!li) return;
    const name = li.dataset.file;
    if (name === "值班守则.txt") {
      openTextWin("值班守则.txt", TEXTS.rules, 600, 560);
    } else if (name === "交接班记录.log") {
      openTextWin("交接班记录.log", TEXTS.log, 600, 320);
    }
  });
}

function openSystemFolder() {
  const win = createWindow({
    title: "系统",
    width: 480,
    height: 240
  });
  win.setBody('<ul class="filelist">' + fileItemHTML("readme.txt", "1 KB", "file") + "</ul>");
  win.body.addEventListener("click", function (e) {
    const li = e.target.closest("li[data-file]");
    if (!li) return;
    openTextWin("readme.txt", TEXTS.readme, 580, 420);
  });
}

function openUnnamed() {
  showModal("文件已损坏或您无权访问。", null, "确定", "关闭");
}

function openFiledFolder() {
  const win = createWindow({
    title: "归档",
    width: 520,
    height: 320
  });

  let h = "";
  if (state.flags.completed) {
    const nm = state.meta.name || "未命名";
    h += '<ul class="filelist">';
    h += fileItemHTML(nm + ".B7", "3 KB", "file");
    h += "</ul>";
    h += '<div class="empty-note">最近一次归档：' + dateStr(0) + '</div>';
  } else {
    h += '<div class="empty-note">此文件夹为空。</div>';
  }
  win.setBody(h);

  win.body.addEventListener("click", function (e) {
    const li = e.target.closest("li[data-file]");
    if (!li) return;
    const name = li.dataset.file;
    if (name.indexOf(".B7") >= 0) {
      const nm = state.meta.name || "（未提供）";
      let txt = "第七观测站 居民档案副本\n";
      txt += "--------------------------------\n";
      txt += "姓名：" + nm + "\n";
      txt += "档案编号：" + (state.flags.archiveId || genArchiveId()) + "\n";
      txt += "归档日期：" + dateStr(0) + "\n";
      txt += "居住区域：" + (state.answers["q6"] || "（未提供）") + "\n";
      txt += "居住楼层：" + (state.meta.floor ? state.meta.floor + " 层" : "（未提供）") + "\n";
      txt += "门牌号：" + (state.meta.door || "（未提供）") + "\n";
      txt += "--------------------------------\n";
      txt += "本副本仅供归档科内部查阅。\n";
      txt += "请勿复制、请勿外传、请勿核对。\n";
      openTextWin(nm + ".B7", txt, 520, 340);
    }
  });
}

function openTrash() {
  const win = createWindow({
    title: "回收站",
    width: 520,
    height: 300
  });

  const late = (state.page >= 6) || state.flags.q13 !== null || state.flags.completed;

  let h = "";
  if (late) {
    h += '<ul class="filelist">';
    h += fileItemHTML("B7-____.tmp", "0 KB", "file");
    h += "</ul>";
    h += '<div class="empty-note">1 个项目。删除时间：--:--</div>';
  } else {
    h += '<div class="empty-note">回收站为空。</div>';
  }
  win.setBody(h);

  win.body.addEventListener("click", function (e) {
    const li = e.target.closest("li[data-file]");
    if (!li) return;
    openTextWin("B7-____.tmp",
      "该文件正在被使用中。\n\n无法读取，无法删除，无法重命名。\n\n（请勿重复尝试。）", 460, 260);
  });
}

document.querySelectorAll(".dicon").forEach(function (el) {
  el.addEventListener("click", function () {
    const kind = el.dataset.open;
    if (kind === "archive") openArchiveFolder();
    else if (kind === "rules") openRulesFolder();
    else if (kind === "system") openSystemFolder();
    else if (kind === "unnamed") openUnnamed();
    else if (kind === "filed") openFiledFolder();
    else if (kind === "trash") openTrash();
  });
});

/* ============================================================
   17. 启动
   ============================================================ */
(function init() {
  syncMeta();
})();

</script>
